name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  ARTIFACT_PYTHON: "3.12.11"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --frozen
      - name: Provision DuckDB Excel extension
        timeout-minutes: 5
        env:
          LOCALQL_TEST_DUCKDB_EXTENSION_DIRECTORY: ${{ runner.temp }}/localql-duckdb-extensions
        run: |
          set -euo pipefail
          uv run --frozen --no-sync python - <<'PY'
          import os
          import time
          from pathlib import Path

          import duckdb

          extension_directory = Path(
              os.environ["LOCALQL_TEST_DUCKDB_EXTENSION_DIRECTORY"]
          )
          extension_directory.mkdir(parents=True, exist_ok=True)
          connection = duckdb.connect(
              database=":memory:",
              config={
                  "autoinstall_known_extensions": "false",
                  "autoload_known_extensions": "false",
                  "extension_directory": str(extension_directory),
              },
          )
          try:
              for attempt in range(2):
                  try:
                      connection.install_extension("excel")
                      break
                  except duckdb.Error:
                      if attempt == 1:
                          raise
                      time.sleep(1)
              state = connection.execute(
                  """
                  SELECT installed, extension_version, install_mode
                  FROM duckdb_extensions()
                  WHERE extension_name = ?
                  """,
                  ["excel"],
              ).fetchone()
              if state is None or not state[0]:
                  raise RuntimeError("DuckDB Excel extension provisioning did not complete.")
              print(
                  {
                      "duckdb_version": duckdb.__version__,
                      "excel_extension_version": state[1],
                      "install_mode": state[2],
                  }
              )
          finally:
              connection.close()
          PY
      - name: Verify pull request test merge
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_OID: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_OID: ${{ github.event.pull_request.head.sha }}
          PR_TEST_MERGE_OID: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "${PR_TEST_MERGE_OID}"
          test "$(git rev-parse --verify HEAD^1)" = "${PR_BASE_OID}"
          test "$(git rev-parse --verify HEAD^2)" = "${PR_HEAD_OID}"
      - name: Baseline truth
        run: |
          pwd -P
          git status --short --branch
          git log -1 --oneline
          git remote -v
          git tag --points-at HEAD
          uv --version
          uv run python --version
          uv run --all-extras csvql --version
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run --all-extras mypy src
      - name: Test
        env:
          LOCALQL_TEST_DUCKDB_EXTENSION_DIRECTORY: ${{ runner.temp }}/localql-duckdb-extensions
          LOCALQL_REQUIRE_PROVISIONED_EXCEL: "1"
        run: uv run --all-extras pytest
      - name: Verify exact release artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          uv python install "${ARTIFACT_PYTHON}"
          mkdir -p output/ci-release-dist
          uv run --frozen --no-sync python scripts/audit_public_release.py --repo . --expected-repository "${GITHUB_REPOSITORY}" --candidate "${GITHUB_SHA}" --tree-only
          uv build --python "${ARTIFACT_PYTHON}" --sdist --wheel \
            --no-create-gitignore \
            --out-dir output/ci-release-dist \
            --build-constraints scripts/release-build-constraints.txt \
            --require-hashes
          uv run --frozen --no-sync python scripts/audit_package_contents.py \
            output/ci-release-dist --expected-version 1.2.0
          uv run --frozen --no-sync python scripts/verify_release_artifacts.py \
            inspect output/ci-release-dist --expected-version 1.2.0
          uvx --from twine==6.2.0 twine check \
            output/ci-release-dist/localql-1.2.0-py3-none-any.whl \
            output/ci-release-dist/localql-1.2.0.tar.gz
          uv --version > output/ci-release-uv-version.txt
          uv run --python "${ARTIFACT_PYTHON}" --no-sync python --version \
            > output/ci-release-python-version.txt
          shasum -a 256 scripts/release-build-constraints.txt \
            > output/ci-release-build-constraints.sha256
